<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/uniflow-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UniFlow — Unified Student Life Management Platform. Smart Student Dashboard, Timetable & Calendar, Assignments & Deadlines, Personal Money Management, and Student Profile." />
    <title>UniFlow — Unified Student Life Management Platform</title>

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Zero-Flash Theme Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('uniflow_theme_preference');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          } else if (saved === 'system') {
            if (systemDark) {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
              document.documentElement.style.colorScheme = 'dark';
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
              document.documentElement.style.colorScheme = 'light';
            }
          } else {
            // Default: Theme B - Midnight Intelligence (dark)
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-text-main font-sans antialiased min-h-screen selection:bg-primary/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
